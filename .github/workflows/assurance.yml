name: Check reservation case
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1
        with:
          auto-config: 'false'
          use-github-cache: 'false'
      - name: Build the proof, audit axioms and compare implementations
        run: |
          set -o pipefail
          python3 scripts/check.py | tee "$RUNNER_TEMP/reservation.json"
          {
            echo '### Reservation evidence'
            echo '```json'
            cat "$RUNNER_TEMP/reservation.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
